<!DOCTYPE html>
<html lang="nl-NL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Resource Hints - Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kcujsjibycqnngjhdzbp.supabase.co" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://kcujsjibycqnngjhdzbp.supabase.co" />
    
    <!-- Basis-title; description/robots/canonical worden per route door de SEO-component gezet -->
    <title>Dakdekker Noord-Holland, Flevoland & Utrecht | Feigro</title>

    
    <!-- Open Graph (fallback; per-route tags worden door de SEO-component gezet) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="FEIGRO Dakwerken" />
    

    <meta property="og:image" content="https://feigro.nl/og-image.png" />
    <meta property="og:image:width" content="750" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="FEIGRO Dakwerken" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://feigro.nl/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Kritiek lettertype (Lustra, alle koppen sitebreed) zelf gehost vanuit
         public/fonts - preloaden kan alleen met een stabiele URL, niet met een
         door Vite gehashte src/assets-import. -->
    <link rel="preload" href="/fonts/lustra-text-semi-bold.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Fonts with display swap for better performance.
         Inter, DM Sans én Aldrich in één request (was twee losse Google Fonts-
         aanvragen: deze <link> plus een render-blocking @import in index.css). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Aldrich&display=swap" rel="stylesheet" />
    
    <!--
      Schema.org JSON-LD wordt op runtime gezet door <SiteSchema /> (src/components/seo/SiteSchema.tsx),
      zodat er één bron van waarheid is: src/lib/structured-data.ts.
      Zet hier geen statische blokken meer neer - die kwamen op elke URL terecht en liepen uit de pas.
    -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
